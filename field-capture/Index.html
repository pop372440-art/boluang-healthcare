<!doctype html><html lang="th"><head><base target="_top"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>บ่อหลวง • เก็บข้อมูลภาคสนาม</title>
<style>*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;background:#f1f5f9;color:#0f172a;margin:0;padding:20px}main{max-width:560px;margin:20px auto;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:28px}h1{font-size:24px;margin:0}label{display:block;font-weight:600;margin-top:16px}input,select,textarea,button{font:inherit;width:100%;padding:12px;border:1px solid #94a3b8;border-radius:9px;margin-top:6px}button{background:#047857;color:white;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e2e8f0;color:#0f172a}p{color:#475569}#message{white-space:pre-wrap;overflow-wrap:anywhere}#preview{max-width:100%;max-height:240px;margin-top:12px}input:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #10b981;outline-offset:2px}[hidden]{display:none!important}</style>
</head><body><main><h1>บ่อหลวง • เก็บข้อมูลภาคสนาม</h1><p>เฉพาะเจ้าหน้าที่เทศบาลที่ได้รับสิทธิ์ตามหมู่บ้าน</p>
<form id="login"><label for="email">อีเมลเจ้าหน้าที่</label><input id="email" type="email" autocomplete="username" maxlength="254" required><label for="password">รหัสผ่านบัญชีระบบ</label><input id="password" type="password" autocomplete="current-password" maxlength="1024" required><button type="submit">เข้าสู่ระบบ</button></form>
<form id="capture" hidden>
<label for="village">หมู่บ้านรับผิดชอบ</label><select id="village" required></select>
<label for="fullName">ชื่อ–สกุลผู้รับบริการ</label><input id="fullName" maxlength="160" required autocomplete="off">
<label for="address">ที่อยู่ (ระบุหมู่ให้ตรงกับที่เลือก)</label><textarea id="address" maxlength="500" required></textarea>
<label for="image">ถ่ายรูปหรือเลือกรูป JPEG / PNG ไม่เกิน 2 MB</label><input id="image" type="file" accept="image/jpeg,image/png" capture="environment" required><img id="preview" hidden alt="ภาพก่อนบันทึก">
<button id="locate" type="button" class="secondary">รับพิกัดปัจจุบัน</button><p id="coordinates">ยังไม่ได้รับพิกัด</p>
<button type="submit">บันทึกรูปและพิกัด</button><button id="logout" type="button" class="secondary">ออกจากระบบ</button>
</form><p id="message" role="status" aria-live="polite"></p></main>
<script>
(()=>{'use strict';
 const el=id=>document.getElementById(id);let token='',expiresAt=0,image='',position=null,previewUrl='',requestId='',busy=false;
 const rpc=(method,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(()=>reject(Error('ดำเนินการไม่สำเร็จ กรุณาตรวจสิทธิ์หรือเข้าสู่ระบบใหม่')))[method](...args));
 function message(text){el('message').textContent=text;}
 function resetCapture(){el('capture').reset();image='';position=null;requestId=crypto.randomUUID();if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl='';el('preview').removeAttribute('src');el('preview').hidden=true;el('coordinates').textContent='ยังไม่ได้รับพิกัด';}
 function clearSession(){token='';expiresAt=0;resetCapture();el('village').replaceChildren();el('capture').hidden=true;el('login').hidden=false;el('password').value='';}
 async function run(task){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await task();}catch(e){message(e.message);}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
 function requireSession(){if(!token||Date.now()>=expiresAt){clearSession();throw Error('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');}}
 el('login').addEventListener('submit',event=>{event.preventDefault();run(async()=>{message('กำลังเข้าสู่ระบบ…');try{const result=await rpc('signInCollector',el('email').value.trim(),el('password').value);token=result.accessToken;expiresAt=Date.now()+result.expiresIn*1000;resetCapture();el('village').replaceChildren();for(const n of result.villages){const option=document.createElement('option');option.value=String(n);option.textContent='หมู่ที่ '+n;el('village').appendChild(option);}el('login').hidden=true;el('capture').hidden=false;message('เข้าสู่ระบบแล้ว บันทึกได้เฉพาะหมู่บ้านที่ได้รับสิทธิ์');}finally{el('password').value='';}});});
 el('image').addEventListener('change',()=>{image='';if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl='';el('preview').removeAttribute('src');el('preview').hidden=true;const file=el('image').files[0];if(!file)return;if(!['image/jpeg','image/png'].includes(file.type)||file.size>2097152){el('image').value='';message('ใช้ภาพ JPEG หรือ PNG ขนาดไม่เกิน 2 MB');return;}const reader=new FileReader();reader.onload=()=>{if(el('image').files[0]!==file||!token)return;image=reader.result;previewUrl=URL.createObjectURL(file);el('preview').src=previewUrl;el('preview').hidden=false;};reader.onerror=()=>message('อ่านรูปไม่สำเร็จ');reader.readAsDataURL(file);});
 el('locate').addEventListener('click',()=>run(async()=>{requireSession();if(!navigator.geolocation)throw Error('เบราว์เซอร์นี้ไม่รองรับพิกัด');position=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(p=>resolve({latitude:p.coords.latitude,longitude:p.coords.longitude}),()=>reject(Error('รับพิกัดไม่ได้ กรุณาอนุญาตตำแหน่งแล้วลองใหม่')),{enableHighAccuracy:true,timeout:20000,maximumAge:0}));el('coordinates').textContent=position.latitude.toFixed(6)+', '+position.longitude.toFixed(6);}));
 el('capture').addEventListener('submit',event=>{event.preventDefault();run(async()=>{requireSession();if(!position||!image)throw Error('กรุณาเลือกรูปและรับพิกัดก่อนบันทึก');message('กำลังตรวจสิทธิ์และบันทึก…');const result=await rpc('saveCapture',token,{requestId,fullName:el('fullName').value,address:el('address').value,village:Number(el('village').value),...position,image});resetCapture();message((result.duplicate?'คำขอนี้บันทึกไว้แล้ว':'บันทึกสำเร็จ')+' • '+result.id);});});
 el('logout').addEventListener('click',()=>run(async()=>{const previous=token;clearSession();try{await rpc('signOutCollector',previous);message('ออกจากระบบแล้ว');}catch(e){message('ล้างข้อมูลบนเครื่องแล้ว แต่ยืนยันการออกจากระบบกับเซิร์ฟเวอร์ไม่ได้');}}));
 window.addEventListener('pagehide',clearSession);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token&&Date.now()>=expiresAt){clearSession();message('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');}});
})();
</script></body></html>
